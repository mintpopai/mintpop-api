name: Security Scan

on:
  push:
    # 仅分支 push；排除 tag push（发版 tag 走 release workflow，这里无需重复跑）
    branches: ['**']
  pull_request:
  schedule:
    - cron: '0 3 * * 1'

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up mise
        uses: jdx/mise-action@v4
      - name: Run govulncheck
        run: mise run audit-backend

  frontend-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up mise
        uses: jdx/mise-action@v4
      - name: Install frontend deps
        run: mise run install-frontend --frozen
      - name: Run pnpm audit
        run: mise run audit-frontend

  user-portal-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up mise
        uses: jdx/mise-action@v4
      - name: Install user-portal deps
        run: mise run install-user-portal --frozen
      - name: Run pnpm audit
        run: mise run audit-user-portal
