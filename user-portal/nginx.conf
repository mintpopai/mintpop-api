server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API 反向代理到后端（compose 网络内服务名 backend:8080）
    # 前端 axios baseURL=/api/v1，所有接口都走 /api/ 前缀；proxy_pass 固定写死为 backend:8080，
    # 无 envsubst 等模板替换机制，要改地址需直接改本文件并重建镜像
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 兼容鉴权续期等长连接/流式响应，关闭缓冲
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # AI 网关转发：让本域名可直接作为 API Key 的接入点（与 backend 域名等效）
    # 前缀清单以 backend/internal/server/routes/gateway.go 顶层注册为准（新增前缀要同步这里）；
    # (/|$) 兼顾 POST /responses、/embeddings 这类无后续路径的端点
    location ~ ^/(v1|v1beta|responses|alpha|chat|embeddings|images|videos|antigravity|backend-api|health)(/|$) {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # LLM 流式（SSE）响应：请求/响应都不缓冲；长推理两段输出间隔可达数分钟，读超时给足
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        # 与后端 gateway.max_body_size（256 MiB）对齐，大小限制由后端统一执行
        client_max_body_size 256m;
    }

    # 静态资源带较长缓存
    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control public,immutable;
    }

    # SPA history 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
